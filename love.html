<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Are You Sure?</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #000;
      color: #fff;
      padding: 32px;
      border-radius: 22px;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 0 40px rgba(255, 105, 180, 0.85);
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 40px rgba(255,105,180,0.7); }
      50% { box-shadow: 0 0 55px rgba(255,105,180,1); }
      100% { box-shadow: 0 0 40px rgba(255,105,180,0.7); }
    }

    h1 {
      color: #ff5fa2;
      margin-bottom: 14px;
    }

    p {
      color: #ffd1e8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .pause {
      font-style: italic;
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 26px;
    }

    a {
      display: inline-block;
      padding: 10px 26px;
      background: #ff5fa2;
      color: #fff;
      text-decoration: none;
      border-radius: 22px;
      font-size: 16px;
    }

    a:hover {
      background: #ff2f92;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Are you sure?</h1>

    <p>
      Think again 😉 This choice comes with the best kind of love—endless care,
      warm moments, and someone who’ll choose you every single day.
    </p>

    <p class="pause">
      Some decisions are quiet… but they echo for a lifetime ✨
    </p>

    <!-- Goes to final celebration page -->
    <a href="thanks.html">Yes, I choose this love 💖</a>
  </div>
</body>
</html>

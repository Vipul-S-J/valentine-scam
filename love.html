<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Are You Sure?</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #2a001a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ✨ Sparkles */
    .sparkles {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#ff9acb 1px, transparent 1px);
      background-size: 120px 120px, 180px 180px;
      animation: sparkle 20s linear infinite;
      opacity: 0.15;
      pointer-events: none;
    }

    @keyframes sparkle {
      from { background-position: 0 0, 0 0; }
      to { background-position: 500px 1000px, -500px 800px; }
    }

    /* 🌹 Falling petals */
    .petals::before {
      content: "🌹 🌸 🌹 🌸 🌹";
      position: fixed;
      width: 100%;
      text-align: center;
      font-size: 22px;
      opacity: 0.2;
      animation: fall 14s linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh); }
      100% { transform: translateY(120vh); }
    }

    /* 💗 Card */
    .card {
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 32px;
      border-radius: 22px;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 0 30px rgba(255,105,180,0.7);
      animation: fadeIn 1.8s ease forwards, pulse 3.5s ease-in-out infinite;
      opacity: 0;
      z-index: 2;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 28px rgba(255,105,180,0.6); }
      50% { box-shadow: 0 0 60px rgba(255,105,180,1); }
      100% { box-shadow: 0 0 28px rgba(255,105,180,0.6); }
    }

    h1 {
      color: #ff5fa2;
      margin-bottom: 14px;
    }

    p {
      color: #ffd1e8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .pause {
      font-style: italic;
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 26px;
    }

    /* 💖 Button (hidden initially) */
    a {
      display: inline-block;
      padding: 10px 26px;
      background: #ff5fa2;
      color: #fff;
      text-decoration: none;
      border-radius: 22px;
      font-size: 16px;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
      animation: buttonIn 1.2s ease forwards;
      animation-delay: 2.4s;
    }

    @keyframes buttonIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    a:hover {
      background: #ff2f92;
      transform: scale(1.05);
      box-shadow: 0 0 22px rgba(255,105,180,0.9);
    }
  </style>
</head>

<body>
  <div class="sparkles"></div>
  <div class="petals"></div>

  <div class="card">
    <h1>Are you sure?</h1>

    <p>
      Think again 😉 This choice comes with the best kind of love—endless care,
      warm moments, and someone who’ll choose you every single day.
    </p>

    <p class="pause">
      Some decisions are quiet… but they echo for a lifetime ✨
    </p>

    <a href="thanks.html">Yes, I choose this love 💖</a>
  </div>
</body>
</html>

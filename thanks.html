<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love You 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* 🌑 Dark romantic background */
    body {
      background:
        radial-gradient(circle at top, rgba(255,105,180,0.18), transparent 60%),
        linear-gradient(180deg, #14000c, #000);
    }

    /* ✨ Sparkles */
    .sparkles {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,182,193,0.9) 1px, transparent 2px);
      background-size: 90px 90px;
      animation: sparkleMove 12s linear infinite;
      z-index: 1;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes sparkleMove {
      from { background-position: 0 0; }
      to { background-position: 600px -600px; }
    }

    /* 💕 Romantic glow */
    .glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 30%, rgba(255,105,180,0.18), transparent 40%),
        radial-gradient(circle at 75% 65%, rgba(255,182,193,0.14), transparent 45%);
      z-index: 2;
      pointer-events: none;
    }

    /* 🌙 Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, transparent 60%, rgba(0,0,0,0.7) 100%);
      z-index: 3;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      text-align: center;
    }

    .card {
      background: rgba(0, 0, 0, 0.9);
      padding: 30px;
      border-radius: 26px;
      box-shadow: 0 0 65px rgba(255, 105, 180, 1);
      max-width: 420px;
      width: 100%;
      animation: heartbeat 2.8s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.03); }
      40% { transform: scale(1); }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    h1 {
      color: #ff5fa2;
      font-size: clamp(24px, 6vw, 30px);
      margin-bottom: 10px;
    }

    #typeText {
      color: #ffd1e8;
      min-height: 48px;
      font-size: clamp(15px, 4.2vw, 17px);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    #hiddenLove {
      opacity: 0;
      margin-top: 10px;
      color: #ffc1dc;
      font-size: clamp(14px, 4vw, 16px);
      animation: fadeIn 3s ease forwards;
      animation-delay: 4.5s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .name {
      margin-top: 12px;
      font-size: clamp(17px, 4.5vw, 20px);
      color: #fff;
      text-shadow: 0 0 12px #ff5fa2, 0 0 25px #ff8fc7;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      animation-delay: 6.5s;
    }

    img {
      width: 100%;
      max-width: 260px;
      margin-top: 18px;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(255,105,180,0.8);
    }

    /* 💥 Click hearts */
    .heart {
      position: fixed;
      font-size: 22px;
      animation: burst 1.4s ease-out forwards;
      pointer-events: none;
      z-index: 6;
    }

    @keyframes burst {
      0% { transform: scale(0); opacity: 1; }
      100% {
        transform: translate(var(--x), var(--y)) scale(1.5);
        opacity: 0;
      }
    }

    /* 💗 Floating hearts */
    .floating-heart {
      position: fixed;
      bottom: -40px;
      font-size: 20px;
      opacity: 0.35;
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes floatUp {
      from { transform: translateY(0) scale(0.8); opacity: 0.4; }
      to { transform: translateY(-120vh) scale(1.2); opacity: 0; }
    }
  </style>
</head>

<body>
  <!-- 🎵 Background music -->
  <audio autoplay loop volume="0.25">
    <source src="love.mp3" type="audio/mpeg">
  </audio>

  <div class="sparkles"></div>
  <div class="glow"></div>
  <div class="vignette"></div>

  <div class="content">
    <div class="card">
      <h1>YAYYYY!!! 🎉💖</h1>

      <div id="typeText"></div>

      <div id="hiddenLove">
        You didn’t just click “yes”… you chose a lifetime of us 💞
      </div>

      <div class="name">Love you, Swathi 💖</div>

      <img src="cute.gif" alt="Cute Valentine Cat">
    </div>
  </div>

  <script>
    /* ✨ Typewriter */
    const text = "You chose love… and I promise to choose you every single day 💖";
    let i = 0;
    const target = document.getElementById("typeText");

    function typeWriter() {
      if (i < text.length) {
        target.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 45);
      }
    }
    typeWriter();

    /* 💥 Click hearts */
    document.addEventListener("click", (e) => {
      for (let i = 0; i < 6; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = e.clientX + "px";
        heart.style.top = e.clientY + "px";
        heart.style.setProperty("--x", `${(Math.random() - 0.5) * 200}px`);
        heart.style.setProperty("--y", `${(Math.random() - 0.5) * 200}px`);
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1400);
      }
    });

    /* 💗 Floating hearts */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "floating-heart";
      h.innerHTML = "💗";
      h.style.left = Math.random() * 100 + "vw";
      h.style.animationDuration = 8 + Math.random() * 6 + "s";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 12000);
    }, 900);
  </script>
</body>
</html>

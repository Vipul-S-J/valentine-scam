<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love You 💖</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ffb6d5, #ffe6f2);
    }

    /* Floating hearts background */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 2px, transparent 3px),
        radial-gradient(circle, rgba(255,105,180,0.9) 3px, transparent 4px),
        radial-gradient(circle, rgba(255,182,193,0.8) 2px, transparent 3px);
      background-size: 120px 120px;
      animation: floatHearts 25s linear infinite;
      z-index: 1;
    }

    @keyframes floatHearts {
      from { background-position: 0 0; }
      to { background-position: 0 -1200px; }
    }

    /* Sparkles */
    .sparkles {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 2px);
      background-size: 80px 80px;
      animation: sparkleMove 12s linear infinite;
      z-index: 2;
      opacity: 0.6;
    }

    @keyframes sparkleMove {
      from { background-position: 0 0; }
      to { background-position: 600px -600px; }
    }

    /* Content card */
    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 0 40px rgba(255, 105, 180, 0.7);
      max-width: 380px;
    }

    h1 {
      color: #ff2f92;
      margin-bottom: 10px;
    }

    h2 {
      color: #ff5fa2;
      margin-bottom: 20px;
    }

    img {
      width: 260px;
      border-radius: 16px;
    }
  </style>
</head>

<body>
  <!-- sparkles layer -->
  <div class="sparkles"></div>

  <!-- content -->
  <div class="content">
    <div class="card">
      <h1>YAYYYY!!! 🎉💖</h1>
      <h2>Love youuu 🥰</h2>

      <!-- Your uploaded gif -->
      <img src="this-is-for-you-cat-flower.gif" alt="Cat holding flowers">
    </div>
  </div>
</body>
</html>

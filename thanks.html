<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Love You 💖</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* 💗 Heart GIF background */
    body {
      background-image: url("heart.gif");
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
    }

    /* ✨ Sparkles overlay */
    .sparkles {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,182,193,0.9) 1px, transparent 2px);
      background-size: 90px 90px;
      animation: sparkleMove 12s linear infinite;
      z-index: 1;
      opacity: 0.7;
    }

    @keyframes sparkleMove {
      from { background-position: 0 0; }
      to { background-position: 600px -600px; }
    }

    /* Center content */
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* ⬛ Black card */
    .card {
      background: rgba(0, 0, 0, 0.9);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 0 45px rgba(255, 105, 180, 0.9);
      max-width: 380px;
    }

    h1 {
      color: #ff5fa2;
      margin-bottom: 10px;
      font-size: 28px;
    }

    h2 {
      color: #ffd1e8;
      margin-bottom: 22px;
    }

    img {
      width: 260px;
      border-radius: 18px;
    }
  </style>
</head>

<body>
  <!-- Sparkles -->
  <div class="sparkles"></div>

  <!-- Content -->
  <div class="content">
    <div class="card">
      <h1>YAYYYY!!! 🎉💖</h1>
      <h2>Love youuu 🥰</h2>

      <!-- 🐱 New gif -->
      <img src="cute.gif" alt="Cute Valentine Cat">
    </div>
  </div>
</body>
</html>

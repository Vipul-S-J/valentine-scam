<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚠️ Scam Alert</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Fullscreen background image */
    body {
      background-image: url("tim-mossholder-UrrIRRX4ff8-unsplash.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Dark overlay for readability */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .card {
      position: relative;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      width: 360px;
      box-shadow: 0 0 30px rgba(255, 0, 120, 0.6);
      color: #fff;
      z-index: 2;
    }

    .warning {
      color: #ff4d6d;
      font-weight: bold;
      margin-bottom: 8px;
    }

    p {
      color: #ffd1e8;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      height: 80px;
      margin-top: 20px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
    }

    #yes {
      background: #ff4da6;
      color: white;
    }

    #no {
      background: #666;
      color: white;
      position: absolute;
      left: 180px;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="card">
    <div class="warning">⚠️ Scam Link Detected</div>
    <p>This link may steal your heart 💔</p>

    <h1>Will you be my Valentine ❤️?</h1>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙃</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200;
      const y = Math.random() * 50;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    document.getElementById("yes").onclick = () => {
      window.location.href = "thanks.html";
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>⚠️ Scam Alert</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      background-image: url("tim-mossholder-UrrIRRX4ff8-unsplash.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1.2s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 0;
    }

    .hearts {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,182,193,0.8) 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.8) 2px, transparent 3px);
      background-size: 70px 70px;
      animation: floatHearts 25s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes floatHearts {
      from { background-position: 0 0; }
      to { background-position: 400px -800px; }
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, #ff5fa2, #ff8fc7);
      border-radius: 18px;
      padding: 30px;
      text-align: center;
      width: 360px;
      box-shadow: 0 0 40px rgba(255, 80, 160, 0.9);
      color: #fff;
      z-index: 2;
      animation: heartbeat 2.6s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    .warning {
      font-weight: bold;
      margin-bottom: 8px;
    }

    p {
      color: #ffe6f2;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .buttons {
      position: relative;
      height: 80px;
      margin-top: 20px;
    }

    button {
      padding: 10px 22px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #yes {
      background: #fff;
      color: #ff4da6;
    }

    #no {
      background: #ff2f92;
      color: #fff;
      position: absolute;
      left: 180px;
    }

    .micro {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>
  <div class="hearts"></div>

  <div class="card">
    <div class="warning">⚠️ Scam Link Detected</div>
    <p>This link may steal your heart 💔</p>

    <h1>Will you be my Valentine ❤️?</h1>

    <p style="font-style: italic; margin-top: -10px;">
      Just one click… and maybe the start of something beautiful ✨
    </p>

    <div class="buttons">
      <button id="yes">Yes, take my heart 💕</button>
      <button id="no">No 🙃</button>
    </div>

    <p class="micro">
      Some clicks change nothing. Some change everything 💞
    </p>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * 200;
      const y = Math.random() * 50;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    yesBtn.onclick = () => {
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "love.html";
      }, 1200);
    };
  </script>
</body>
</html>
